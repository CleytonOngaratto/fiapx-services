name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sem `paths` nem `paths-ignore` de propósito: check obrigatório filtrado por path fica
# "Pending" para sempre quando o filtro não casa, e trava o merge sem nada a fazer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário para o blame e o new-code do SonarCloud, quando ele entrar.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build, test and coverage gate
        run: ./mvnw -B -ntp clean verify

      # O openapi.yaml é gerado pelo build. Se o commit não trouxer a versão atual, o
      # contrato publicado e o código divergem em silêncio.
      - name: OpenAPI drift gate
        run: git diff --exit-code -- video-api/docs/api/openapi.yaml video-api/docs/api/openapi.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/'
          retention-days: 7
