quarkus.application.name=video-api
quarkus.http.port=8080
quarkus.banner.enabled=false

# CORS DA API. A SPA roda noutra origem e chama POST /videos daqui: sem isto o navegador
# bloqueia antes mesmo de existir URL assinada. É a PRIMEIRA das duas superfícies de CORS;
# a segunda é a do bucket, no object storage.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173,http://localhost:8090
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=content-type,authorization

# Cliente S3 do lado SERVIDOR: endpoint que a aplicação alcança.
quarkus.s3.endpoint-override=http://localhost:9090
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.sync-client.type=url

# Endpoint do PRESIGNER: tem de ser alcançável pelo NAVEGADOR, e por isso é separado do
# de cima. No cluster o de cima vira http://s3.fiapx.svc:9090 e este continua o externo.
fiapx.s3.public-endpoint=http://localhost:9090
fiapx.s3.region=us-east-1
fiapx.s3.access-key=test
fiapx.s3.secret-key=test
fiapx.s3.bucket-videos=fiapx-videos
fiapx.s3.upload-ttl-seconds=900

quarkus.smallrye-openapi.store-schema-directory=docs/api
